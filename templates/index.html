<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Entropy & Strength Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 p-8 rounded-xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center">Password Entropy Analyzer</h1>
        
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Enter Password:</label>
            <input type="password" id="passwordInput" placeholder="Type a password..." 
                class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500">
        </div>

        <div id="results" class="space-y-3 hidden">
            <div class="flex justify-between bg-gray-700 p-3 rounded-lg">
                <span>Strength Score:</span>
                <span id="score" class="font-bold">0</span>
            </div>
            <div class="flex justify-between bg-gray-700 p-3 rounded-lg">
                <span>Entropy (bits):</span>
                <span id="entropy" class="font-bold">0</span>
            </div>

            <!-- Character Pool Badges -->
            <div class="grid grid-cols-2 gap-2 text-sm">
                <div id="hasLower" class="p-2 rounded bg-red-900/50 text-center">Lowercase</div>
                <div id="hasUpper" class="p-2 rounded bg-red-900/50 text-center">Uppercase</div>
                <div id="hasDigit" class="p-2 rounded bg-red-900/50 text-center">Numbers</div>
                <div id="hasSymbol" class="p-2 rounded bg-red-900/50 text-center">Symbols</div>
            </div>

            <!-- Estimated Crack Times Card -->
            <div class="bg-gray-700/50 p-4 rounded-lg mt-4 border border-gray-600">
                <h3 class="text-sm font-semibold text-gray-300 mb-2 uppercase tracking-wider">Estimated Time to Crack</h3>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span class="text-gray-400">Online Attack (Throttled):</span>
                        <span id="crackOnline" class="font-medium text-amber-400">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">Desktop CPU (Standard):</span>
                        <span id="crackCpu" class="font-medium text-amber-400">-</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">GPU Rig (Hashcat):</span>
                        <span id="crackGpu" class="font-medium text-amber-400">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('passwordInput');
        const results = document.getElementById('results');

        input.addEventListener('input', async () => {
            const password = input.value;
            if (!password) {
                results.classList.add('hidden');
                return;
            }

            const response = await fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            if (response.ok) {
                const data = await response.json();
                results.classList.remove('hidden');
                document.getElementById('score').innerText = data.score + ' / 100';
                document.getElementById('entropy').innerText = data.entropy + ' bits';

                updateBadge('hasLower', data.hasLower);
                updateBadge('hasUpper', data.hasUpper);
                updateBadge('hasDigit', data.hasDigit);
                updateBadge('hasSymbol', data.hasSymbol);

                // Update Crack Times
                document.getElementById('crackOnline').innerText = data.crackTimes.online;
                document.getElementById('crackCpu').innerText = data.crackTimes.cpu;
                document.getElementById('crackGpu').innerText = data.crackTimes.gpu;
            }
        });

        function updateBadge(id, condition) {
            const el = document.getElementById(id);
            if (condition) {
                el.className = "p-2 rounded bg-green-900/50 text-center text-green-300";
            } else {
                el.className = "p-2 rounded bg-red-900/50 text-center text-red-300";
            }
        }
    </script>
</body>
</html>
